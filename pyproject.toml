[project]
name = "kai"
version = "0.1.0"
description = "Terminal AI agent TUI — Ollama / Gemini / MCP, built with Textual"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "mcp>=1.0.0",
    "textual[syntax]>=8.2.6",
    "openai>=2.37.0",
    "textual-autocomplete>=4.0.6",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "edge-tts>=7.2.8",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.13.1",
    "gradio-client>=2.5.0",
    "websockets>=16.0",
    "textual-fspicker>=1.0.1",
    "google-genai>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "textual-dev>=1.8.0",
    "pytest>=8.0",
    "ipykernel>=7.2.0",
]
